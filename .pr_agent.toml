# Generated by cluster-infra/scripts/render-pr-agent-actions.cjs.
# Native upstream configuration; secrets belong only in Actions environment.
[config]
model = "openrouter/moonshotai/kimi-k2.7-code"
model_weak = "openrouter/moonshotai/kimi-k2.7-code"
fallback_models = []
reasoning_effort = "low"
custom_model_max_tokens = 131072
max_model_tokens = 131072
ai_timeout = 420
retry_same_model_on_timeout = false
retry_same_model_on_length = false
enable_auto_approval = false
publish_output_progress = false
ignore_pr_labels = ["skip-pr-agent"]

[openrouter]
reasoning_effort = "low"
max_tokens = 32768

[github]
ignore_bot_pr = false

[pr_reviewer]
enable_large_pr_chunking = true
# The shipped native handler can attempt each chunk twice on retryable API errors.
# Two chunks therefore preserve the existing four-provider-request ceiling.
max_number_of_calls = 2
enable_review_coverage_footer = true
enable_review_labels_security = false
enable_review_labels_effort = false
require_ticket_analysis_review = false
extra_instructions = "Review the supplied source patches. State omitted, clipped, generated or unavailable inputs as coverage limits; never describe a partial review as a complete PR review."

[ignore]
glob = []
regex = []
