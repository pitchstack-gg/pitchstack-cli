# Generated by cluster-infra/scripts/render-pr-agent-actions.cjs.
name: PR-Agent
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
permissions: {}
concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}-${{ (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'skip-pr-agent') && 'review' || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'skip-pr-agent') && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'skip-pr-agent') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Review with native PR-Agent Action
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.PR_AGENT_OPENROUTER_KEY }}
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "synchronize", "ready_for_review", "unlabeled"]'
          GITHUB_ACTION_CONFIG__FAIL_ON_TOOL_ERRORS: 'true'
          CONFIG__LOG_LEVEL: ERROR
          CONFIG__VERBOSITY_LEVEL: '0'
