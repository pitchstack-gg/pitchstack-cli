# Generated by cluster-infra/scripts/render-pr-agent-actions.cjs.
name: PR-Agent
run-name: "PR-Agent #${{ github.event.pull_request.number || inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || 'manual' }}"
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: Ready internal PR number
        required: true
        type: string
      force:
        description: Review even if opted out or already reviewed
        default: false
        type: boolean
permissions: {}
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || inputs.pr_number }}-${{ (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'skip-pr-agent') && 'review' || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'skip-pr-agent')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Load trusted default-branch runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .pr-agent-base
          sparse-checkout: .github/pr-agent
      - name: Check current PR and create commit-bound check
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_INPUT_NUMBER: ${{ inputs.pr_number }}
          PR_AGENT_FORCE_REVIEW: ${{ inputs.force == true && 'true' || 'false' }}
        run: python3 .pr-agent-base/.github/pr-agent/run.py prepare
      - name: Review data in pinned PR-Agent image
        if: ${{ steps.prepare.outputs.eligible == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.PR_AGENT_OPENROUTER_KEY }}
          PR_AGENT_FORCE_REVIEW: ${{ inputs.force == true && 'true' || 'false' }}
        run: python3 .pr-agent-base/.github/pr-agent/run.py run
      - name: Finalize interrupted review check
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_JOB_STATUS: ${{ job.status }}
        run: python3 .pr-agent-base/.github/pr-agent/run.py finalize
