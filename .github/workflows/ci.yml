# Review gate generated by cluster-infra; existing CI jobs follow its terminal outcome.
name: ci
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  pr-agent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Wait for review before CI (any terminal outcome)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_REPOSITORY: pitchstack-gg/pitchstack-cli
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REVISION: ${{ github.event.pull_request.head.sha }}
          PR_ALLOWED_REPOSITORIES: '["pitchstack-gg/cluster-infra","pitchstack-gg/card-core","pitchstack-gg/card-services-backend","pitchstack-gg/card-services-infra","pitchstack-gg/pitchstack-admin","pitchstack-gg/pitchstack-admin-cli","pitchstack-gg/pitchstack-api-model","pitchstack-gg/pitchstack-backend","pitchstack-gg/pitchstack-bot","pitchstack-gg/pitchstack-cli","pitchstack-gg/pitchstack-discord-bot","pitchstack-gg/pitchstack-frontend","pitchstack-gg/pitchstack-go","pitchstack-gg/pitchstack-infra","pitchstack-gg/pitchstack-mcp","pitchstack-gg/pitchstack-tasks","pitchstack-gg/riftstack-backend","pitchstack-gg/riftstack-frontend","pitchstack-gg/riftstack-infra","pitchstack-gg/voidstack-backend","pitchstack-gg/voidstack-infra"]'
          GITHUB__USER_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """Wait for an Actions review attempt on this exact commit; never run inference."""
          import json
          import os
          import re
          import time
          from urllib.request import Request, urlopen


          def fetch(path):
              request = Request(f"https://api.github.com/repos/{os.environ['PR_REPOSITORY']}/{path}", headers={
                  "Authorization": f"Bearer {os.environ['GITHUB__USER_TOKEN']}", "Accept": "application/vnd.github+json"})
              with urlopen(request, timeout=30) as response:
                  return json.load(response)


          def wait(timeout=1020, interval=10):
              number, revision, repository = os.environ['PR_NUMBER'], os.environ['PR_REVISION'], os.environ['PR_REPOSITORY']
              if not re.fullmatch(r"[1-9][0-9]*", number) or not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise ValueError("Invalid review identity")
              if repository not in json.loads(os.environ['PR_ALLOWED_REPOSITORIES']):
                  raise ValueError("Repository outside allowlist")
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  pr = fetch(f"pulls/{number}")
                  if (pr.get('state') != 'open' or pr.get('draft', True) or pr.get('base', {}).get('ref') != 'main'
                          or (pr.get('head', {}).get('repo') or {}).get('full_name') != repository
                          or pr.get('head', {}).get('sha') != revision
                          or any(x.get('name') == 'skip-pr-agent' for x in pr.get('labels', []))):
                      print('Review gate skipped: current PR is ineligible or opted out.')
                      return
                  checks = fetch(f"commits/{revision}/check-runs?check_name=PR-Agent%20review&per_page=100")['check_runs']
                  matching = [x for x in checks if x.get('name') == 'PR-Agent review' and x.get('head_sha') == revision
                              and x.get('app', {}).get('slug') == 'github-actions'
                              and (x.get('external_id') or '').startswith(f'pr-agent:{number}:{revision}:')]
                  completed = [x for x in matching if x.get('status') == 'completed']
                  if completed:
                      newest = max(completed, key=lambda x: x['id'])
                      print(json.dumps({'event':'pr_agent_actions_gate_completed','conclusion':newest.get('conclusion'),'revision':revision}))
                      return
                  time.sleep(interval)
              raise TimeoutError('GitHub Actions review did not finish within the gate budget')



          # During the migration PR, the trusted default branch has no Actions lane yet.
          # Keep existing CI runnable until that cutover is merged.
          from urllib.error import HTTPError
          try:
              fetch("contents/.github/workflows/pr-agent-review.yml?ref=main")
          except HTTPError as error:
              if error.code == 404:
                  print("Review cutover is not active on main yet")
                  raise SystemExit(0)
              raise

          wait()
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go test ./...
    needs:
      - pr-agent-gate
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish
    needs:
      - pr-agent-gate
