# Inference runs in GitHub Actions. This trusted gate only orders existing Tekton CI.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: 00-pr-agent-review
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch in ["main", "refs/heads/main"] && has(body.pull_request) && !body.pull_request.draft && body.pull_request.base.repo.full_name == "pitchstack-gg/pitchstack-cli" && body.pull_request.head.repo != null && body.pull_request.head.repo.full_name == "pitchstack-gg/pitchstack-cli" && has(body.pull_request.labels) && body.pull_request.labels != null && !body.pull_request.labels.exists(label, label.name == "skip-pr-agent") && body.action in ["opened", "reopened", "synchronize", "ready_for_review", "unlabeled"] && (body.action != "unlabeled" || (has(body.label) && body.label.name == "skip-pr-agent"))
    pipelinesascode.tekton.dev/target-namespace: pitchstack-ci
    pipelinesascode.tekton.dev/max-keep-runs: '3'
spec:
  timeouts:
    pipeline: 19m
  params:
    - name: pr-number
      value: '{{ pull_request_number }}'
    - name: revision
      value: '{{ revision }}'
  taskRunTemplate:
    serviceAccountName: pr-agent-reviewer
    podTemplate:
      automountServiceAccountToken: false
      nodeSelector:
        pitchstack.gg/node-pool: burst
      tolerations:
        - key: pitchstack.gg/burst
          operator: Equal
          value: 'true'
          effect: NoSchedule
  pipelineSpec:
    params:
      - name: pr-number
        type: string
      - name: revision
        type: string
    tasks:
      - name: review
        timeout: 18m
        params:
          - name: pr-number
            value: $(params.pr-number)
          - name: revision
            value: $(params.revision)
          - name: repository
            value: pitchstack-gg/pitchstack-cli
          - name: git-auth-secret
            value: '{{ git_auth_secret }}'
        taskSpec:
          params:
            - name: pr-number
              type: string
            - name: revision
              type: string
            - name: repository
              type: string
            - name: git-auth-secret
              type: string
          steps:
            - name: wait-for-actions
              image: docker.io/library/python@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
              computeResources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: PR_NUMBER
                  value: $(params.pr-number)
                - name: PR_REVISION
                  value: $(params.revision)
                - name: PR_REPOSITORY
                  value: $(params.repository)
                - name: PR_ALLOWED_REPOSITORIES
                  value: '["pitchstack-gg/cluster-infra","pitchstack-gg/card-core","pitchstack-gg/card-services-backend","pitchstack-gg/card-services-infra","pitchstack-gg/pitchstack-admin","pitchstack-gg/pitchstack-admin-cli","pitchstack-gg/pitchstack-api-model","pitchstack-gg/pitchstack-backend","pitchstack-gg/pitchstack-bot","pitchstack-gg/pitchstack-cli","pitchstack-gg/pitchstack-discord-bot","pitchstack-gg/pitchstack-frontend","pitchstack-gg/pitchstack-go","pitchstack-gg/pitchstack-infra","pitchstack-gg/pitchstack-mcp","pitchstack-gg/pitchstack-tasks","pitchstack-gg/riftstack-backend","pitchstack-gg/riftstack-frontend","pitchstack-gg/riftstack-infra","pitchstack-gg/voidstack-backend","pitchstack-gg/voidstack-infra"]'
                - name: GITHUB__USER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: $(params.git-auth-secret)
                      key: git-provider-token
              script: |
                #!/usr/bin/env python3
                """Wait for an Actions review attempt on this exact commit; never run inference."""
                import json
                import os
                import re
                import time
                from urllib.request import Request, urlopen


                def fetch(path):
                    request = Request(f"https://api.github.com/repos/{os.environ['PR_REPOSITORY']}/{path}", headers={
                        "Authorization": f"Bearer {os.environ['GITHUB__USER_TOKEN']}", "Accept": "application/vnd.github+json"})
                    with urlopen(request, timeout=30) as response:
                        return json.load(response)


                def review_checks(revision):
                    # GitHub defaults to the latest attempt per check name, hiding prior completions.
                    for page in range(1, 11):
                        checks = fetch(f"commits/{revision}/check-runs?check_name=PR-Agent%20review&filter=all&per_page=100&page={page}")['check_runs']
                        yield from checks
                        if len(checks) < 100:
                            return


                def wait(timeout=1020, interval=10):
                    number, revision, repository = os.environ['PR_NUMBER'], os.environ['PR_REVISION'], os.environ['PR_REPOSITORY']
                    if not re.fullmatch(r"[1-9][0-9]*", number) or not re.fullmatch(r"[0-9a-f]{40}", revision):
                        raise ValueError("Invalid review identity")
                    if repository not in json.loads(os.environ['PR_ALLOWED_REPOSITORIES']):
                        raise ValueError("Repository outside allowlist")
                    deadline = time.monotonic() + timeout
                    while time.monotonic() < deadline:
                        pr = fetch(f"pulls/{number}")
                        if (pr.get('state') != 'open' or pr.get('draft', True) or pr.get('base', {}).get('ref') != 'main'
                                or (pr.get('head', {}).get('repo') or {}).get('full_name') != repository
                                or pr.get('head', {}).get('sha') != revision
                                or any(x.get('name') == 'skip-pr-agent' for x in pr.get('labels', []))):
                            print('Review gate skipped: current PR is ineligible or opted out.')
                            return
                        checks = review_checks(revision)
                        matching = [x for x in checks if x.get('name') == 'PR-Agent review' and x.get('head_sha') == revision
                                    and x.get('app', {}).get('slug') == 'github-actions'
                                    and (x.get('external_id') or '').startswith(f'pr-agent:{number}:{revision}:')]
                        completed = [x for x in matching if x.get('status') == 'completed']
                        if completed:
                            newest = max(completed, key=lambda x: x['id'])
                            print(json.dumps({'event':'pr_agent_actions_gate_completed','conclusion':newest.get('conclusion'),'revision':revision}))
                            return
                        time.sleep(interval)
                    raise TimeoutError('GitHub Actions review did not finish within the gate budget')


                if __name__ == '__main__':
                    try:
                        wait()
                    except Exception as error:
                        print(json.dumps({'event':'pr_agent_actions_gate_failed','error_type':type(error).__name__}))
                        raise SystemExit(1)
